<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratica.dev 2.0</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body class="h-full">
    <div class="app-wrapper gradient-bg text-white" id="app">
        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="flex items-center justify-center h-full p-4" style="display: flex;">
            <div class="card-glass rounded-2xl p-8 w-full max-w-md fade-in">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold mb-2">
                        <span class="text-green-400 font-mono">&lt;</span>Pratica.dev<span class="text-green-400 font-mono">/&gt;</span> 
                        <span class="text-purple-400">2.0</span>
                    </h1>
                    <p class="text-white/50 text-sm">Seu mentor digital de carreira em tecnologia</p>
                </div>
                
                <!-- Login Form -->
                <div id="login-form">
                    <div class="mb-4">
                        <label class="block text-sm text-white/60 mb-1">Email</label>
                        <input type="email" id="login-email" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-green-400" placeholder="seu@email.com">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm text-white/60 mb-1">Senha</label>
                        <input type="password" id="login-password" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-green-400" placeholder="••••••••">
                    </div>
                    <div id="login-error" class="text-red-400 text-sm mb-4 hidden"></div>
                    <button onclick="handleLogin()" class="btn-primary w-full py-3 rounded-lg text-lg mb-3">Entrar</button>
                    <button onclick="showRegister()" class="btn-secondary w-full py-3 rounded-lg">Criar Conta</button>
                </div>
                
                <!-- Register Form -->
                <div id="register-form" class="hidden">
                    <div class="mb-3">
                        <label class="block text-sm text-white/60 mb-1">Nome completo</label>
                        <input type="text" id="reg-name" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-green-400" placeholder="Seu nome">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-white/60 mb-1">Idade</label>
                        <input type="number" id="reg-age" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-green-400" placeholder="17">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-white/60 mb-1">Email</label>
                        <input type="email" id="reg-email" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-green-400" placeholder="seu@email.com">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm text-white/60 mb-1">Senha</label>
                        <input type="password" id="reg-password" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-green-400" placeholder="••••••••">
                    </div>
                    <div id="reg-error" class="text-red-400 text-sm mb-4 hidden"></div>
                    <button onclick="handleRegister()" class="btn-primary w-full py-3 rounded-lg text-lg mb-3">Cadastrar</button>
                    <button onclick="showLogin()" class="btn-secondary w-full py-3 rounded-lg">Voltar ao Login</button>
                </div>
            </div>
        </div>
        
        <!-- MAIN APP -->
        <div id="main-app" class="hidden h-full flex flex-col">
            <!-- TOP NAV -->
            <header class="flex items-center justify-between px-6 py-4 border-b border-white/5">
                <h1 class="text-xl font-bold">
                    <span class="text-green-400 font-mono">&lt;</span>Pratica.dev<span class="text-green-400 font-mono">/&gt;</span> 
                    <span class="text-purple-400 text-sm">2.0</span>
                </h1>
                <div class="flex items-center gap-4">
                    <span id="nav-user" class="text-sm text-white/60"></span>
                    <span id="nav-level" class="level-badge"></span>
                    <span id="nav-xp" class="xp-badge"></span>
                    <button onclick="handleLogout()" class="text-white/40 hover:text-red-400 transition text-sm">Sair</button>
                </div>
            </header>
            
            <div class="flex flex-1 overflow-hidden">
                <!-- SIDEBAR -->
                <nav class="w-56 p-4 border-r border-white/5 overflow-y-auto flex-shrink-0">
                    <div class="space-y-1">
                        <div class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
                            <i data-lucide="layout-dashboard" class="inline w-4 h-4 mr-2"></i>Dashboard
                        </div>
                        <div class="nav-item" data-tab="perfil" onclick="switchTab('perfil')">
                            <i data-lucide="user" class="inline w-4 h-4 mr-2"></i>Perfil
                        </div>
                        <div class="nav-item" data-tab="evolucao" onclick="switchTab('evolucao')">
                            <i data-lucide="trending-up" class="inline w-4 h-4 mr-2"></i>Evolução
                        </div>
                        <div class="nav-item" data-tab="estudos" onclick="switchTab('estudos')">
                            <i data-lucide="book-open" class="inline w-4 h-4 mr-2"></i>Centro de Estudos
                        </div>
                        <div class="nav-item" data-tab="sobre" onclick="switchTab('sobre')">
                            <i data-lucide="info" class="inline w-4 h-4 mr-2"></i>Sobre o Curso
                        </div>
                        <div class="nav-item" data-tab="projetos" onclick="switchTab('projetos')">
                            <i data-lucide="code-2" class="inline w-4 h-4 mr-2"></i>Projetos
                        </div>
                        <div class="nav-item" data-tab="portfolio" onclick="switchTab('portfolio')">
                            <i data-lucide="briefcase" class="inline w-4 h-4 mr-2"></i>Portfólio
                        </div>
                    </div>
                </nav>
                
                <!-- CONTENT -->
                <main class="flex-1 overflow-y-auto p-6" id="main-content">
                    <!-- Dashboard -->
                    <div class="tab-content active" id="tab-dashboard"></div>
                    <!-- Perfil -->
                    <div class="tab-content" id="tab-perfil"></div>
                    <!-- Evolução -->
                    <div class="tab-content" id="tab-evolucao"></div>
                    <!-- Estudos -->
                    <div class="tab-content" id="tab-estudos"></div>
                    <!-- Sobre -->
                    <div class="tab-content" id="tab-sobre"></div>
                    <!-- Projetos -->
                    <div class="tab-content" id="tab-projetos"></div>
                    <!-- Portfólio -->
                    <div class="tab-content" id="tab-portfolio"></div>
                </main>
            </div>
        </div>
        
        <!-- QUIZ MODAL -->
        <div id="quiz-modal" class="modal-overlay hidden">
            <div class="card-glass rounded-2xl p-8 w-full max-w-lg mx-4 fade-in">
                <h2 class="text-xl font-bold mb-2 text-center">🚀 Vamos personalizar sua jornada!</h2>
                <p class="text-white/50 text-sm text-center mb-6">Responda 3 perguntas rápidas para montar sua trilha.</p>
                <div id="quiz-steps"></div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
